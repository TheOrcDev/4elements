<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Four Elements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="veil"></div>
      <header class="brand">
        <p class="eyebrow">Primordial Forces</p>
        <h1>Four Elements</h1>
        <p class="tagline">Fire · Water · Earth · Air — living in one field</p>
      </header>
      <aside class="legend" aria-label="Element legend">
        <button type="button" data-focus="fire"><span class="dot fire"></span>Fire</button>
        <button type="button" data-focus="water"><span class="dot water"></span>Water</button>
        <button type="button" data-focus="earth"><span class="dot earth"></span>Earth</button>
        <button type="button" data-focus="air"><span class="dot air"></span>Air</button>
      </aside>
      <p class="hint">Drag to orbit · Scroll to zoom · Click an element to focus</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

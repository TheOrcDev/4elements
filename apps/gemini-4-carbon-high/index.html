<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Four Elements · Outdoor Natural Realms</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%230b1624' stroke='%239ad6b8' stroke-width='3.5'/><path d='M14 38 Q32 22 50 38' fill='none' stroke='%2338c9ff' stroke-width='4'/><circle cx='32' cy='22' r='6' fill='%23ffb347'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-glass: rgba(10, 16, 26, 0.58);
        --bg-glass-hover: rgba(16, 26, 40, 0.8);
        --border-subtle: rgba(255, 255, 255, 0.15);
        --border-strong: rgba(255, 255, 255, 0.34);
        --text-primary: #f5f8fc;
        --text-muted: rgba(226, 235, 248, 0.76);
        --accent-nature: #ebd098;
        --tour-progress: 0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070d16;
        color: var(--text-primary);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      #canvas-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* -------------------------------------------------------------------
         Quad-Realm 2x2 Split-Screen Interactive Overlay (view === 'all')
         ------------------------------------------------------------------- */
      #quad-grid {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        transition: opacity 0.32s ease, visibility 0.32s ease;
      }

      #quad-grid.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Crisp 1px hair-line cross dividers between the 4 live outdoor scenes */
      #quad-grid::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        z-index: 3;
      }

      #quad-grid::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        z-index: 3;
      }

      .quad-center-gem {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 9px;
        height: 9px;
        transform: translate(-50%, -50%) rotate(45deg);
        background: rgba(14, 22, 34, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.36);
        pointer-events: none;
        z-index: 4;
        transition: opacity 0.3s ease;
      }

      body.hud-hidden .quad-center-gem {
        opacity: 0;
      }

      .quad-cell {
        position: relative;
        appearance: none;
        background: transparent;
        border: none;
        cursor: pointer;
        text-align: left;
        color: inherit;
        font-family: inherit;
        outline: none;
        overflow: hidden;
        transition: box-shadow 0.28s ease;
      }

      .quad-cell:hover,
      .quad-cell:focus-visible {
        box-shadow: inset 0 0 0 1.5px
            color-mix(in srgb, var(--q-accent, #fff) 65%, rgba(255, 255, 255, 0.35)),
          inset 0 0 42px rgba(0, 0, 0, 0.14);
      }

      .quad-label {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        max-width: calc(100% - 36px);
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(9, 15, 24, 0.62);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
        transition: transform 0.24s ease, background 0.24s ease, border-color 0.24s ease,
          opacity 0.3s ease;
        pointer-events: none;
      }

      body.hud-hidden .quad-label {
        opacity: 0;
      }

      /* Position each quadrant badge cleanly away from top HUD and bottom dock */
      .quad-cell[data-realm='fire'] .quad-label {
        left: 20px;
        bottom: 14px;
      }

      .quad-cell[data-realm='water'] .quad-label {
        right: 20px;
        bottom: 14px;
      }

      .quad-cell[data-realm='earth'] .quad-label {
        left: 20px;
        bottom: 78px;
      }

      .quad-cell[data-realm='air'] .quad-label {
        right: 20px;
        bottom: 78px;
      }

      .quad-cell:hover .quad-label {
        transform: translateY(-2px);
        background: rgba(14, 23, 38, 0.84);
        border-color: color-mix(in srgb, var(--q-accent, #fff) 70%, rgba(255, 255, 255, 0.3));
      }

      .quad-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--q-accent, #fff);
        box-shadow: 0 0 9px var(--q-accent, #fff);
        flex-shrink: 0;
      }

      .quad-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }

      .quad-name {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 0.96rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #ffffff;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .quad-sub {
        font-size: 0.67rem;
        color: rgba(228, 236, 248, 0.78);
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .quad-enter {
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--q-accent, #ebd098);
        opacity: 0.75;
        margin-left: 4px;
        flex-shrink: 0;
        transition: opacity 0.22s ease, transform 0.22s ease;
      }

      .quad-cell:hover .quad-enter {
        opacity: 1;
        transform: translateX(2px);
      }

      /* -------------------------------------------------------------------
         Top HUD Bar
         ------------------------------------------------------------------- */
      .hud-top {
        position: fixed;
        top: 18px;
        left: 22px;
        right: 22px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        z-index: 5;
        pointer-events: none;
        transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
      }

      body.hud-hidden .hud-top {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-12px);
      }

      .brand-block {
        pointer-events: auto;
        padding: 10px 16px;
        border-radius: 16px;
        background: rgba(8, 14, 23, 0.52);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.13);
        max-width: 472px;
      }

      .brand-eyebrow {
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent-nature);
        margin-bottom: 2px;
        font-weight: 600;
      }

      .brand-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.48rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #f9fbff;
        line-height: 1.08;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
      }

      .brand-hint {
        margin-top: 4px;
        font-size: 0.71rem;
        color: var(--text-muted);
        line-height: 1.38;
      }

      /* Top-Right Two-Tier Controls Cluster */
      .controls-cluster {
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }

      .controls-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
      }

      .glass-pill {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 13px;
        border-radius: 999px;
        background: var(--bg-glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border-subtle);
        font-size: 0.74rem;
        color: var(--text-primary);
        white-space: nowrap;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      }

      .telemetry-pill {
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      .telemetry-pill strong {
        color: var(--text-primary);
        font-weight: 600;
      }

      .telemetry-sep {
        opacity: 0.35;
      }

      .slider-group label {
        color: var(--text-muted);
        font-weight: 500;
      }

      .slider-group input[type='range'] {
        width: 72px;
        accent-color: var(--accent-nature);
        cursor: pointer;
      }

      #intensity-val {
        min-width: 30px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--accent-nature);
      }

      .action-btn {
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        transition: background 0.22s ease, border-color 0.22s ease, color 0.22s ease,
          box-shadow 0.22s ease;
      }

      .action-btn:hover {
        background: var(--bg-glass-hover);
        border-color: var(--border-strong);
      }

      .action-btn.active {
        border-color: var(--accent-nature);
        color: var(--accent-nature);
        background: rgba(235, 208, 152, 0.16);
      }

      .quality-btn strong {
        color: var(--accent-nature);
        font-weight: 600;
      }

      .subtle-btn {
        color: var(--text-muted);
        font-weight: 500;
      }

      .subtle-btn:hover {
        color: var(--text-primary);
      }

      /* Guided Tour Button & Progress Bar */
      .tour-btn {
        overflow: hidden;
      }

      .tour-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(235, 208, 152, 0.55);
        transition: background 0.25s ease, box-shadow 0.25s ease;
      }

      .tour-btn.active .tour-dot {
        background: var(--accent-nature);
        box-shadow: 0 0 9px var(--accent-nature);
      }

      .pill-progress {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, #ebd098, #ffffff);
        transform-origin: left center;
        transform: scaleX(var(--tour-progress, 0));
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }

      .tour-btn.active .pill-progress {
        opacity: 0.95;
      }

      /* Nature Audio Button & Animated Equaliser Bars */
      .eq-bars {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
        width: 14px;
      }

      .eq-bar {
        width: 2.5px;
        height: 100%;
        border-radius: 2px;
        background: rgba(226, 235, 248, 0.52);
        transform-origin: bottom center;
        transform: scaleY(0.32);
        transition: background 0.25s ease, transform 0.25s ease;
      }

      .sound-btn.active .eq-bar {
        background: var(--accent-nature);
        animation: eqDance 0.95s ease-in-out infinite alternate;
      }

      .sound-btn.active .eq-bar:nth-child(1) {
        animation-duration: 0.72s;
        animation-delay: 0s;
      }

      .sound-btn.active .eq-bar:nth-child(2) {
        animation-duration: 0.94s;
        animation-delay: 0.18s;
      }

      .sound-btn.active .eq-bar:nth-child(3) {
        animation-duration: 0.66s;
        animation-delay: 0.31s;
      }

      .sound-btn.active .eq-bar:nth-child(4) {
        animation-duration: 0.86s;
        animation-delay: 0.11s;
      }

      @keyframes eqDance {
        0% {
          transform: scaleY(0.28);
        }
        50% {
          transform: scaleY(0.98);
        }
        100% {
          transform: scaleY(0.46);
        }
      }

      /* Natural Surge Button */
      .surge-btn {
        border-color: rgba(235, 208, 152, 0.45);
        background: linear-gradient(
          135deg,
          rgba(255, 110, 36, 0.24),
          rgba(38, 188, 255, 0.22),
          rgba(72, 209, 128, 0.22)
        );
      }

      .surge-btn:hover,
      .surge-btn.surging {
        border-color: #ffe8b8;
        box-shadow: 0 0 24px rgba(235, 208, 152, 0.4);
      }

      /* Pure Cinema Restore Pill (only visible when HUD is hidden) */
      .show-hud-pill {
        position: fixed;
        right: 20px;
        bottom: 18px;
        z-index: 6;
        padding: 6px 13px;
        border-radius: 999px;
        background: rgba(8, 14, 24, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(245, 248, 252, 0.86);
        font-family: inherit;
        font-size: 0.71rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 0.3s ease, transform 0.3s ease, background 0.22s ease,
          border-color 0.22s ease, visibility 0.3s ease;
      }

      body.hud-hidden .show-hud-pill {
        opacity: 0.6;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
      }

      body.hud-hidden .show-hud-pill:hover {
        opacity: 1;
        background: rgba(14, 22, 36, 0.88);
        border-color: rgba(235, 208, 152, 0.6);
        color: #ffffff;
      }

      /* -------------------------------------------------------------------
         Contextual Single-Realm Inspector Card
         ------------------------------------------------------------------- */
      .element-card {
        position: fixed;
        left: 22px;
        bottom: 82px;
        width: min(356px, calc(100vw - 44px));
        padding: 17px 19px;
        border-radius: 18px;
        background: rgba(9, 15, 25, 0.68);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid color-mix(in srgb, var(--card-accent, #fff) 42%, rgba(255, 255, 255, 0.14));
        box-shadow: 0 18px 46px rgba(0, 0, 0, 0.45);
        z-index: 5;
        transition: opacity 0.32s ease, transform 0.32s ease, visibility 0.32s ease;
      }

      .element-card.hidden,
      body.hud-hidden .element-card {
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
        pointer-events: none;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }

      .card-symbol {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 1.18rem;
        background: color-mix(in srgb, var(--card-accent, #fff) 18%, transparent);
        border: 1px solid color-mix(in srgb, var(--card-accent, #fff) 48%, transparent);
        color: var(--card-accent, #fff);
        flex-shrink: 0;
      }

      .card-title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.22rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        line-height: 1.12;
      }

      .card-subtitle {
        font-size: 0.73rem;
        color: var(--card-accent, #ebd098);
        font-weight: 500;
        margin-top: 1px;
      }

      .card-desc {
        font-size: 0.78rem;
        line-height: 1.54;
        color: rgba(235, 241, 252, 0.88);
        margin-bottom: 11px;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.11);
      }

      .card-stats {
        font-size: 0.68rem;
        color: var(--text-muted);
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }

      .card-back-btn {
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: var(--text-primary);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 0.71rem;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .card-back-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.38);
      }

      /* -------------------------------------------------------------------
         Bottom Realm Navigation Dock
         ------------------------------------------------------------------- */
      .hud-bottom {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px;
        border-radius: 999px;
        background: rgba(8, 14, 24, 0.68);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.48);
        transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
      }

      body.hud-hidden .hud-bottom {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translate(-50%, 14px);
      }

      .nav-btn {
        position: relative;
        overflow: hidden;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text-muted);
        padding: 8px 15px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 0.76rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        transition: all 0.22s ease;
        white-space: nowrap;
      }

      .nav-btn:hover {
        color: var(--text-primary);
        background: rgba(255, 255, 255, 0.08);
      }

      .nav-btn.active {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.14);
        border-color: var(--nav-accent, rgba(235, 208, 152, 0.58));
        box-shadow: 0 0 16px color-mix(in srgb, var(--nav-accent, #ebd098) 28%, transparent);
      }

      /* Subtle Guided Tour progress bar along active dock pill */
      .nav-btn::after {
        content: '';
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 2px;
        height: 2px;
        border-radius: 2px;
        background: var(--nav-accent, #ebd098);
        transform-origin: left center;
        transform: scaleX(var(--tour-progress, 0));
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }

      body.tour-active .nav-btn.active::after {
        opacity: 0.92;
      }

      .nav-swatch {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--nav-accent, #ebd098);
      }

      @media (max-width: 980px) {
        .hud-top {
          flex-direction: column;
          align-items: stretch;
        }
        .controls-cluster {
          align-items: flex-start;
        }
        .controls-row {
          justify-content: flex-start;
        }
        .telemetry-pill {
          display: none;
        }
        .quad-sub,
        .quad-enter {
          display: none;
        }
        .hud-bottom {
          max-width: calc(100vw - 24px);
          overflow-x: auto;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BHB4IgYe.js"></script>
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- 2x2 Quad-Realm Interactive Overlay (Active when view === 'all') -->
    <div id="quad-grid" aria-label="Four Outdoor Elemental Realms">
      <button
        type="button"
        class="quad-cell"
        data-realm="fire"
        style="--q-accent: #ff6e24"
        aria-label="Enter Fire Realm"
      >
        <div class="quad-label">
          <span class="quad-dot"></span>
          <span class="quad-text">
            <span class="quad-name" id="quad-title-fire">Fire · Volcanic Canyon</span>
            <span class="quad-sub" id="quad-sub-fire">Molten Lava River &amp; Smoky Dusk Wildfire</span>
          </span>
          <span class="quad-enter">Enter →</span>
        </div>
      </button>

      <button
        type="button"
        class="quad-cell"
        data-realm="water"
        style="--q-accent: #28c6ff"
        aria-label="Enter Water Realm"
      >
        <div class="quad-label">
          <span class="quad-dot"></span>
          <span class="quad-text">
            <span class="quad-name" id="quad-title-water">Water · Coastal Waterfall Cove</span>
            <span class="quad-sub" id="quad-sub-water">Sunlit Ocean Swells &amp; Plunging Sea Cliff Falls</span>
          </span>
          <span class="quad-enter">Enter →</span>
        </div>
      </button>

      <button
        type="button"
        class="quad-cell"
        data-realm="earth"
        style="--q-accent: #52d681"
        aria-label="Enter Earth Realm"
      >
        <div class="quad-label">
          <span class="quad-dot"></span>
          <span class="quad-text">
            <span class="quad-name" id="quad-title-earth">Earth · Sunlit Alpine Meadow</span>
            <span class="quad-sub" id="quad-sub-earth">Wind-Rippling Valley Grass &amp; Ancient Forest</span>
          </span>
          <span class="quad-enter">Enter →</span>
        </div>
      </button>

      <button
        type="button"
        class="quad-cell"
        data-realm="air"
        style="--q-accent: #9ec8ff"
        aria-label="Enter Air Realm"
      >
        <div class="quad-label">
          <span class="quad-dot"></span>
          <span class="quad-text">
            <span class="quad-name" id="quad-title-air">Air · High Mountain Summit</span>
            <span class="quad-sub" id="quad-sub-air">Drifting Cloud Sea, Thermal Birds &amp; Spindrift</span>
          </span>
          <span class="quad-enter">Enter →</span>
        </div>
      </button>

      <span class="quad-center-gem" aria-hidden="true"></span>
    </div>

    <!-- Top Header & Natural Environment Controls -->
    <header class="hud-top">
      <div class="brand-block">
        <div class="brand-eyebrow">Four Outdoor Realms · Real-Time Nature</div>
        <h1 class="brand-title">The Four Elements</h1>
        <p class="brand-hint" id="brand-hint">
          Click any realm or press 1–4 · 0 / Esc for All Realms · T (Tour) · M (Audio) · H (Hide UI)
        </p>
      </div>

      <div class="controls-cluster">
        <div class="controls-row">
          <button
            id="btn-tour"
            type="button"
            class="glass-pill action-btn tour-btn"
            aria-pressed="false"
            title="Choreographed Guided Tour across all outdoor realms (T)"
          >
            <span class="tour-dot" aria-hidden="true"></span>
            <span id="tour-label">Guided Tour</span>
            <span class="pill-progress" aria-hidden="true"></span>
          </button>

          <button
            id="btn-sound"
            type="button"
            class="glass-pill action-btn sound-btn"
            aria-pressed="false"
            title="Toggle procedural outdoor nature acoustics (M)"
          >
            <span class="eq-bars" aria-hidden="true">
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
            </span>
            <span id="sound-label">Nature Audio</span>
          </button>

          <button
            id="btn-drift"
            type="button"
            class="glass-pill action-btn"
            aria-pressed="false"
            title="Gentle panoramic camera drift"
          >
            Auto-Drift
          </button>

          <button
            id="btn-surge"
            type="button"
            class="glass-pill action-btn surge-btn"
            title="Trigger dramatic natural surge across the realms (Space)"
          >
            ✦ Natural Surge
          </button>
        </div>

        <div class="controls-row">
          <div class="glass-pill telemetry-pill" aria-live="polite">
            <span><strong id="particle-count">14,000</strong> Particles</span>
            <span class="telemetry-sep">|</span>
            <span id="fps-counter">60 FPS</span>
          </div>

          <div class="glass-pill slider-group">
            <label for="intensity-slider">Intensity / Wind</label>
            <input
              id="intensity-slider"
              type="range"
              min="0.5"
              max="1.8"
              step="0.1"
              value="1.0"
            />
            <span id="intensity-val">1.0×</span>
          </div>

          <button
            id="btn-quality"
            type="button"
            class="glass-pill action-btn quality-btn"
            title="Switch rendering pixel-ratio &amp; bloom resolution tier (Q)"
          >
            <span>Quality · <strong id="quality-label">Ultra</strong></span>
          </button>

          <button
            id="btn-hide-hud"
            type="button"
            class="glass-pill action-btn subtle-btn"
            title="Pure Cinema mode — hide interface (H)"
          >
            Hide UI
          </button>
        </div>
      </div>
    </header>

    <!-- Pure Cinema Restore Pill -->
    <button
      id="btn-show-hud"
      type="button"
      class="show-hud-pill"
      title="Restore interface controls (H)"
    >
      Show UI (H)
    </button>

    <!-- Contextual Single-Realm Inspector Card -->
    <aside id="element-card" class="element-card hidden" aria-live="polite">
      <div class="card-header">
        <div id="card-symbol" class="card-symbol">🜂</div>
        <div>
          <h2 id="card-title" class="card-title">Fire · Volcanic Canyon</h2>
          <div id="card-subtitle" class="card-subtitle">Lava River &amp; Wildfire Dusk</div>
        </div>
      </div>
      <p id="card-desc" class="card-desc"></p>
      <div class="card-footer">
        <span id="card-stats" class="card-stats"></span>
        <button id="card-back" type="button" class="card-back-btn">← All Realms</button>
      </div>
    </aside>

    <!-- Bottom Realm Preset Dock -->
    <nav class="hud-bottom" aria-label="Realm Views">
      <button
        type="button"
        class="nav-btn active"
        data-view="all"
        style="--nav-accent: #ebd098"
      >
        <span class="nav-swatch"></span>
        All Realms
      </button>
      <button
        type="button"
        class="nav-btn"
        data-view="fire"
        style="--nav-accent: #ff6e24"
      >
        <span class="nav-swatch"></span>
        Fire
      </button>
      <button
        type="button"
        class="nav-btn"
        data-view="water"
        style="--nav-accent: #28c6ff"
      >
        <span class="nav-swatch"></span>
        Water
      </button>
      <button
        type="button"
        class="nav-btn"
        data-view="earth"
        style="--nav-accent: #52d681"
      >
        <span class="nav-swatch"></span>
        Earth
      </button>
      <button
        type="button"
        class="nav-btn"
        data-view="air"
        style="--nav-accent: #9ec8ff"
      >
        <span class="nav-swatch"></span>
        Air
      </button>
    </nav>

  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Four Elements — Three.js</title>
  </head>
  <body>
    <div id="scene-root"></div>

    <div id="vignette"></div>

    <div id="intro">
      <h1>FOUR ELEMENTS</h1>
      <p class="subtitle">
        <span class="fire">Fire</span> &middot; <span class="water">Water</span> &middot;
        <span class="air">Air</span> &middot; <span class="earth">Earth</span>
      </p>
      <p class="hint">Click anywhere to begin</p>
    </div>

    <div id="controls-hint">Drag to orbit &middot; Scroll to zoom &middot; Click an element to focus</div>

    <div id="info-panel">
      <h2 id="info-name"></h2>
      <p id="info-desc"></p>
      <button id="info-close" type="button">Back to overview</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

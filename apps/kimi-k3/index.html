<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Four Elements</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: #060606;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #app, #app canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .ui {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 10;
        pointer-events: none;
      }
      header.ui { top: 30px; text-align: center; }
      header.ui h1 {
        display: inline-block;
        font-weight: 200;
        color: #ece7db;
        font-size: clamp(18px, 2.6vw, 30px);
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        text-transform: uppercase;
        text-shadow: 0 0 26px rgba(255, 255, 255, 0.18);
      }
      header.ui .rule {
        width: 130px;
        height: 1px;
        margin: 12px auto 0;
        background: linear-gradient(90deg, transparent, rgba(236, 231, 219, 0.5), transparent);
      }
      nav.ui { bottom: 52px; display: flex; justify-content: center; }
      .nav {
        pointer-events: auto;
        display: flex;
        gap: 8px;
        padding: 9px;
        background: rgba(16, 16, 20, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .nav button {
        --accent: #ffffff;
        display: flex;
        align-items: center;
        gap: 9px;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #b9b3a6;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 11px 20px;
        cursor: pointer;
        transition: color 0.25s, border-color 0.25s, box-shadow 0.25s, background 0.25s;
      }
      .nav button .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 9px var(--accent);
        transition: transform 0.25s;
      }
      .nav button:hover { color: #fff; border-color: var(--accent); }
      .nav button.active {
        color: #fff;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.07);
        box-shadow: 0 0 22px -6px var(--accent), inset 0 0 14px -10px var(--accent);
      }
      .nav button.active .dot { transform: scale(1.35); }
      .hint {
        bottom: 18px;
        text-align: center;
        color: rgba(220, 214, 200, 0.38);
        font-size: 11px;
        letter-spacing: 0.18em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <header class="ui">
      <h1>Four Elements</h1>
      <div class="rule"></div>
    </header>

    <nav class="ui">
      <div class="nav">
        <button style="--accent:#ff7a29" data-el="0"><span class="dot"></span>Fire</button>
        <button style="--accent:#3fa9f5" data-el="1"><span class="dot"></span>Water</button>
        <button style="--accent:#d9a441" data-el="2"><span class="dot"></span>Earth</button>
        <button style="--accent:#5adbe8" data-el="3"><span class="dot"></span>Air</button>
      </div>
    </nav>

    <p class="ui hint">Drag to orbit &nbsp;&middot;&nbsp; Scroll to zoom &nbsp;&middot;&nbsp; Keys 1&ndash;4 / &larr; &rarr;</p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

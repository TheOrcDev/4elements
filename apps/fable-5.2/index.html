<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Elementa: fire, water, earth and air in one real-time Three.js scene." />
    <title>Elementa — The Four Elements</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      .scene-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

      /* Loading screen. Painted before any script runs; src/ui/ui.js drives and removes it.
         --u is the interface's size unit (see src/ui/ui.css): 1px, a little more on very wide screens. */
      .loader {
        --u: clamp(1px, 0.62px + 0.0227vw, 1.3px);
        position: fixed; inset: 0; z-index: 20; box-sizing: border-box; padding: 24px;
        display: grid; place-content: center; justify-items: center; gap: calc(var(--u) * 30);
        background: #05070d; color: #efe9dd; text-align: center; pointer-events: none;
        font: 500 calc(var(--u) * 10) / 1.5 'Manrope Variable', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        letter-spacing: 0.32em; text-transform: uppercase; -webkit-font-smoothing: antialiased;
      }
      .noui .loader { display: none; }
      .loader__seal { display: block; width: min(calc(var(--u) * 176), 44vw); height: auto; overflow: visible; }
      .loader__breath { animation: loader-breathe 4.2s ease-in-out infinite; }
      .loader__seal circle, .loader__seal path { fill: none; stroke: currentColor; stroke-width: 1.1; }
      .loader__seal .loader__track { opacity: 0.16; }
      .loader__seal .loader__ring { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.1s cubic-bezier(0.3, 0.6, 0.2, 1); }
      .loader__seal .loader__pad { fill: #05070d; stroke: none; }
      .loader__sign path { opacity: 0.3; transition: opacity 1.2s ease, stroke 1.2s ease; }
      .loader__sign.is-lit path { opacity: 1; stroke: var(--tint, currentColor); }
      /* The words wait for their typefaces (ui.js adds .has-fonts) instead of flashing a fallback;
         should the script never arrive they still come up, late. */
      .loader__name, .loader__label { opacity: 0; transition: opacity 1.4s ease; animation: loader-late 1.4s ease 6s both; }
      .loader__name {
        --o: 0.94; margin: 0 -0.46em 0 0;
        font: 500 calc(var(--u) * 19) / 1 'Cormorant Garamond Variable', 'Cormorant Garamond', Georgia, serif; letter-spacing: 0.46em;
      }
      .loader__label { --o: 0.46; margin: calc(var(--u) * -14) -0.32em 0 0; min-height: 1.5em; }
      .loader.has-fonts .loader__name, .loader.has-fonts .loader__label { opacity: var(--o); animation: none; }
      .loader__label--noscript { display: none; }
      @keyframes loader-breathe { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      @keyframes loader-late { from { opacity: 0; } to { opacity: var(--o); } }
      @media (prefers-reduced-motion: reduce) {
        .loader__breath { animation: none; }
        .loader__seal .loader__ring, .loader__sign path, .loader__name, .loader__label { transition-duration: 0.01s; }
      }
    </style>
    <noscript>
      <style>.loader__name { opacity: 0.94; animation: none; } .loader__label { display: none; } .loader__label--noscript { display: block; opacity: 0.6; animation: none; }</style>
    </noscript>
    <script>
      // The loading screen is lifted by the interface module. When that module is skipped
      // (?noui) or fails to load, hide the screen so the scene is never left covered.
      (function () {
        var html = document.documentElement;
        if (new URLSearchParams(location.search).has('noui')) { html.classList.add('noui'); return; }
        var watch = setInterval(function () {
          if (html.classList.contains('has-ui')) { clearInterval(watch); return; }
          if (window.__ready !== true) return;
          clearInterval(watch);
          html.classList.add('noui');
        }, 300);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui">
      <div class="loader" role="status" aria-live="polite">
        <!-- The seal: the four alchemical signs on a ring, placed as the elements stand in the scene. -->
        <svg class="loader__seal" viewBox="0 0 160 160" aria-hidden="true" focusable="false">
          <g class="loader__breath">
            <circle class="loader__track" cx="80" cy="80" r="56" />
            <circle class="loader__ring" cx="80" cy="80" r="56" pathLength="1" transform="rotate(-90 80 80)" />
            <g class="loader__sign" data-id="fire" transform="translate(80 24)">
              <circle class="loader__pad" r="19" /><path d="M0-12 10.39 6H-10.39Z" />
            </g>
            <g class="loader__sign" data-id="air" transform="translate(136 80)">
              <circle class="loader__pad" r="19" /><path d="M0-12 10.39 6H-10.39ZM-8.2-4.4H8.2" />
            </g>
            <g class="loader__sign" data-id="water" transform="translate(80 136)">
              <circle class="loader__pad" r="19" /><path d="M0 12 10.39-6H-10.39Z" />
            </g>
            <g class="loader__sign" data-id="earth" transform="translate(24 80)">
              <circle class="loader__pad" r="19" /><path d="M0 12 10.39-6H-10.39ZM-8.2 4.4H8.2" />
            </g>
          </g>
        </svg>
        <p class="loader__name">Elementa</p>
        <p class="loader__label">Loading</p>
        <p class="loader__label loader__label--noscript">This scene needs JavaScript and WebGL 2</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

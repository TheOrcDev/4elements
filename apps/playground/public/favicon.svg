<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="4 Elements">
  <title>4 Elements</title>

  <rect width="32" height="32" rx="7" fill="#0b0b0d"/>

  <!--
    2×2 grid. Glyphs drawn around (0,0), then translated to
    quadrant centers so all four sit on the same alignment:
      NW (8, 8)  air · NE (24, 8)  flame
      SW (8, 24) plant · SE (24, 24) water
  -->

  <!-- Air -->
  <g transform="translate(8 8)" fill="none" stroke="#f3eee4" stroke-width="1.7" stroke-linecap="round">
    <path d="M-4.6 -3.6 C-1.6 -5.8 1.6 -5.8 4.6 -3.6"/>
    <path d="M-4.6 0 C-1.4 -2.4 1.4 -2.4 4.6 0"/>
    <path d="M-3.6 3.6 C-1.2 1.6 1.2 1.6 3.6 3.6"/>
  </g>

  <!-- Flame -->
  <g transform="translate(24 8)">
    <path
      fill="#ff5a1f"
      d="M0.5 -5.4
         C2.2 -3.4 4.2 -1.4 4.2 1.1
         C4.2 3.6 2.4 5.5 0 5.5
         C-2.4 5.5 -4.2 3.6 -4.2 1.1
         C-4.2 -0.5 -3.3 -2 -2.4 -3
         C-1.5 -1.5 -0.5 -0.5 0.1 0.2
         C0.1 -1.8 0.1 -3.8 0.5 -5.4 Z"
    />
    <path
      fill="#ffc46a"
      d="M0.15 1.5
         C-1.15 1.5 -2 0.45 -2 -0.85
         C-2 -2.2 -1.15 -3.35 -0.2 -4.15
         C0.55 -2.95 1.3 -1.75 1.3 -0.55
         C1.3 0.75 1.2 1.5 0.15 1.5 Z"
    />
  </g>

  <!-- Water drop -->
  <g transform="translate(24 24)">
    <path
      fill="#1f8fff"
      d="M0 -5.2
         C-2.8 -2.2 -4.5 0 -4.5 2.3
         C-4.5 4.9 -2.5 6.6 0 6.6
         C2.5 6.6 4.5 4.9 4.5 2.3
         C4.5 0 2.8 -2.2 0 -5.2 Z"
    />
    <ellipse
      cx="-1.45"
      cy="1.5"
      rx="1.1"
      ry="1.65"
      fill="#9ad0ff"
      opacity="0.9"
      transform="rotate(-18 -1.45 1.5)"
    />
  </g>

  <!-- Plant -->
  <g transform="translate(8 24)">
    <path d="M0 5.4 V-0.4" fill="none" stroke="#1f9a42" stroke-width="1.5" stroke-linecap="round"/>
    <path fill="#22a34a" d="M0 1.5 C-3.5 0.9 -5.2 -1.5 -5.4 -4.1 C-2.2 -3.7 -0.4 -1.7 0 1.5 Z"/>
    <path fill="#2fc45a" d="M0 0.1 C3.3 -0.9 5.4 -3.1 5.8 -5.7 C2.5 -4.9 0.6 -2.7 0 0.1 Z"/>
    <path fill="#34d399" d="M0 -1.3 C-0.95 -3.3 -0.75 -5.3 0 -6.7 C0.75 -5.3 0.95 -3.3 0 -1.3 Z"/>
  </g>
</svg>
